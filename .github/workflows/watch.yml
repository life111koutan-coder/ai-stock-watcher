name: AI Stock Watch

on:
  push:
    branches: [main]
    paths:
      - 'watch.py'
      - 'news.py'
      - 'news_sources.json'
      - 'tests/test_watch*.py'
      - 'tests/test_watch*.cjs'
      - 'watchlist.json'
      - '.github/workflows/watch.yml'
  schedule:
    # 09:02-18:47 JST。毎時00分の混雑を避け、1回の実行でも複数バッチを進める。
    - cron: '2-57/5 0-8 * * 1-5'
    - cron: '2-47/5 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-stock-watch-main
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test watcher logic
        run: |
          python3 -m unittest discover -s tests -p 'test_watch*.py'
          python3 -m unittest discover -s tests -p 'test_news.py'
          node tests/test_watch_ui.cjs
      - name: Run watcher
        id: watcher
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_NEWS_USER_ID: ${{ secrets.LINE_NEWS_USER_ID }}
          SCAN_BATCH_SIZE: '100'
          SCAN_RUN_BUDGET_SECONDS: '300'
          SCAN_WORKERS: '8'
          SCAN_MAX_RETRIES: '3'
          AUTO_WATCH_MIN_SCORE: '75'
          AUTO_WATCH_MIN_TURNOVER: '100000000'
          WATCH_NEWS_PATH: ${{ runner.temp }}/watch-news.json
        run: |
          python3 news.py --output "$WATCH_NEWS_PATH"
          python3 watch.py
      - name: Commit latest data
        if: ${{ always() && steps.watcher.outcome != 'skipped' && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json latest.json scan_state.json market_scan.json watchlist.json recommendation_history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update stock watcher data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Report scan and notification health
        if: ${{ always() && !cancelled() }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          scan = json.loads(Path('market_scan.json').read_text())
          latest = json.loads(Path('latest.json').read_text())
          line = latest.get('line_notification', {})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"## Stock watcher\nUpdated: {latest.get('generated_at')}\n\n")
              f.write(f"Monitored: {len(latest.get('stocks', []))}; price errors: {len(latest.get('errors', []))}\n\n")
              f.write(f"Scan date: {scan.get('cycle_date')}; processed: {scan.get('cycle_scanned_count')}/{scan.get('universe_count')}; complete: {scan.get('cycle_complete')}\n\n")
              f.write(f"Retries: {scan.get('retry_count')}; failed: {scan.get('failed_count')}\n\n")
              f.write(f"LINE configured: {line.get('configured', False)}; missing: {', '.join(line.get('missing', []))}; pending decisions: {line.get('pending_count', 0)}\n")
          PY
