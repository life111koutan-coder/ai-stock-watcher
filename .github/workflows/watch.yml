name: AI Stock Watch

on:
  push:
    branches: [main]
    paths:
      - 'watch.py'
      - 'watchlist.json'
      - '.github/workflows/watch.yml'
  schedule:
    # 09:00-18:45 JST。全銘柄を一巡した後、通信失敗分を再試行する時間も確保。
    - cron: '*/15 0-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-stock-watch-main
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test watcher logic
        run: python3 -m unittest discover -s tests -p 'test_watch.py'
      - name: Run watcher
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_NEWS_USER_ID: ${{ secrets.LINE_NEWS_USER_ID }}
          SCAN_BATCH_SIZE: '250'
          SCAN_WORKERS: '8'
          SCAN_MAX_RETRIES: '3'
          AUTO_WATCH_MIN_SCORE: '75'
          AUTO_WATCH_MIN_TURNOVER: '100000000'
        run: python3 watch.py
      - name: Commit latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json latest.json scan_state.json market_scan.json watchlist.json recommendation_history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update stock watcher data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
